<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAVIC — منصة التحقق الذكية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

* { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal',sans-serif; }

body {
  background:#0f172a;
  color:#fff;
  min-height:100vh;
  padding:20px;
  position:relative;
}

/* العناصر المزخرفة */
.bg1,.bg2,.bg3 {
  position:fixed;
  border-radius:50%;
  filter:blur(120px);
  pointer-events:none;
  z-index:0;
}
.bg1 { top:-10%; right:-10%; width:600px; height:600px; background:rgba(16,185,129,.15); }
.bg2 { bottom:-10%; left:-15%; width:700px; height:700px; background:rgba(245,158,11,.1); }
.bg3 { top:40%; left:20%; width:400px; height:400px; background:rgba(20,184,166,.1); }

.container {
  max-width:900px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

/* ===== الشعار والعنوان ===== */
.logo-section {
  text-align:center;
  margin-bottom:30px;
  padding-top:10px;
}

.logo-card {
  background: transparent;   /* إزالة الإطار والخلفية */
  border: none;
  border-radius: 0;
  padding: 0;
  box-shadow: none;
  max-width: 240px;
  margin: 0 auto 15px;
  position:relative;
}

.logo-card::before,
.logo-card::after {
  display: none;   /* إزالة الزخارف الجانبية */
}

.logo-card img {
  max-width: 100%;
  width: 150px;
  height: auto;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 3px 12px rgba(16,185,129,.25));
}

/* إخفاء النص المكرر */
.logo-card h1,
.logo-card p,
.logo-card .divider {
  display: none;
}

.path-badge {
  color:#fcd34d;
  text-align:center;
  font-size:14px;
  font-weight:500;
  margin-bottom:10px;
}

.main-title {
  color:#FFFFFF;
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:8px;
  text-shadow: 0 2px 20px rgba(16,185,129,.3);
}

.subtitle {
  color:#6ee7b7;
  text-align:center;
  font-size:16px;
  margin-bottom:30px;
  line-height:1.6;
}

/* ===== الإحصائيات ===== */
.stats {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin-bottom:30px;
}

.stat {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:18px;
  text-align:center;
  backdrop-filter: blur(10px);
  transition: all .3s;
}
.stat:hover {
  transform: translateY(-3px);
  border-color: rgba(16,185,129,.3);
  box-shadow: 0 10px 30px rgba(16,185,129,.15);
}
.stat-label {
  font-size:12px;
  color:#94a3b8;
  margin-bottom:6px;
}
.stat-value {
  font-size:28px;
  font-weight:900;
  color:#6ee7b7;
}

/* ===== بطاقة الإدخال ===== */
.card {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius:24px;
  padding:32px;
  backdrop-filter: blur(20px);
  margin-bottom:24px;
  box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.card h2 {
  font-size:19px;
  font-weight:700;
  margin-bottom:20px;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
}

textarea {
  width:100%;
  min-height:140px;
  padding:18px;
  border-radius:14px;
  background: rgba(15,23,42,.6);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  font-size:15px;
  line-height:1.7;
  resize:vertical;
  outline:none;
  transition: all .3s;
  font-family:'Tajawal',sans-serif;
}
textarea:focus {
  border-color: rgba(16,185,129,.5);
  box-shadow: 0 0 0 3px rgba(16,185,129,.2);
  background: rgba(15,23,42,.8);
}
textarea::placeholder { color:#64748b; }

/* ===== زر التحقق ===== */
.btn {
  width:100%;
  height:56px;
  border:none;
  border-radius:14px;
  background: linear-gradient(135deg, #10b981, #14b8a6);
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  transition: all .3s;
  margin-top:18px;
  position:relative;
  overflow:hidden;
  font-family:'Tajawal',sans-serif;
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 15px 40px rgba(16,185,129,.35);
}
.btn:disabled {
  opacity:.85;
  cursor:not-allowed;
  background: linear-gradient(135deg, #10b981, #0d9488);
  color:#fff;
}

/* Spinner داخل الزر */
.btn.loading::after {
  content:'';
  position:absolute;
  right:20px;
  top:50%;
  transform: translateY(-50%);
  width:22px;
  height:22px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation: spinBtn .8s linear infinite;
}

@keyframes spinBtn {
  to { transform: translateY(-50%) rotate(360deg); }
}

/* ===== إشعار جاري التحقق ===== */
.loading-notice {
  display:none;
  background: rgba(16,185,129,.08);
  border: 1.5px solid rgba(16,185,129,.3);
  border-radius:16px;
  padding:24px;
  margin-top:20px;
  text-align:center;
  animation: fadeIn .4s ease;
}

.loading-notice.active {
  display:block;
}

.loading-notice .spinner-large {
  width:50px;
  height:50px;
  margin: 0 auto 15px;
  border:4px solid rgba(16,185,129,.2);
  border-top-color:#10b981;
  border-radius:50%;
  animation: spinLarge 1s linear infinite;
}

@keyframes spinLarge {
  to { transform: rotate(360deg); }
}

.loading-notice h3 {
  color:#6ee7b7;
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.loading-notice p {
  color:#94a3b8;
  font-size:14px;
  line-height:1.6;
}

/* ===== النتائج ===== */
.result {
  background: rgba(16,185,129,.08);
  border: 1.5px solid rgba(16,185,129,.2);
  border-radius:16px;
  padding:28px;
  margin-top:20px;
  animation: fadeIn .5s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform: translateY(10px); }
  to { opacity:1; transform: translateY(0); }
}

.badge {
  display:inline-block;
  padding:8px 20px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
  margin-bottom:20px;
}
.badge.high { background:rgba(16,185,129,.2); color:#6ee7b7; border:1px solid rgba(16,185,129,.4); }
.badge.medium { background:rgba(245,158,11,.2); color:#fcd34d; border:1px solid rgba(245,158,11,.4); }
.badge.low, .badge.none { background:rgba(239,68,68,.2); color:#fca5a5; border:1px solid rgba(239,68,68,.4); }
.badge.deterministic { background:rgba(59,130,246,.2); color:#93c5fd; border:1px solid rgba(59,130,246,.4); }

.answer {
  font-size:16px;
  line-height:1.9;
  white-space:pre-wrap;
  color:#e2e8f0;
}
.answer a { color:#6ee7b7; text-decoration:underline; }

.source {
  background: rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-right: 4px solid #C9A961;
  border-radius:12px;
  padding:18px;
  margin-top:14px;
}
.source p {
  font-size:14px;
  line-height:1.8;
  margin-bottom:10px;
  color:#cbd5e1;
}
.meta {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  font-size:11px;
}
.meta span {
  background:rgba(255,255,255,.06);
  padding:4px 10px;
  border-radius:8px;
  color:#94a3b8;
}

.error {
  background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.3);
  color:#fca5a5;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:center;
  font-size:15px;
}
</style>
</head>
<body>
<div class="bg1"></div><div class="bg2"></div><div class="bg3"></div>

<div class="container">

  <!-- ===== الشعار والعنوان ===== -->
  <div class="logo-section">
    <div class="logo-card">
      <img src="/static/logo.png" alt="MAVIC Logo">
    </div>

    <div class="path-badge">المسار الرابع: أدوات المعرفة والتحقق</div>
    <h1 class="main-title">🛡️ منصة MAVIC للتحقق</h1>
    <p class="subtitle">ابحث في آلاف المصادر الإسلامية الموثقة في أقل من ثانية</p>
  </div>

  <!-- ===== الإحصائيات ===== -->
  <div class="stats">
    <div class="stat"><div class="stat-label">إجمالي المصادر</div><div class="stat-value" id="total">—</div></div>
    <div class="stat"><div class="stat-label">القرآن الكريم</div><div class="stat-value" id="quran">—</div></div>
    <div class="stat"><div class="stat-label">الأحاديث</div><div class="stat-value" id="hadith">—</div></div>
    <div class="stat"><div class="stat-label">الفقه</div><div class="stat-value" id="other">—</div></div>
  </div>

  <!-- ===== بطاقة الإدخال ===== -->
  <div class="card">
    <h2>🔍 اكتب نصًا للتحقق من صحته</h2>
    <textarea id="q" placeholder="اكتب هنا حديثاً، آية، أو سؤالاً فقهياً للتحقق منه..."></textarea>
    <button class="btn" id="verifyBtn">🔍 تحقق الآن</button>
  </div>

  <!-- ===== إشعار جاري التحقق ===== -->
  <div class="loading-notice" id="loadingNotice">
    <div class="spinner-large"></div>
    <h3>⏳ انتظر قليلاً — جاري التحقق</h3>
    <p>نبحث في المصادر الموثقة ونحلل النص... قد يستغرق الأمر بضع ثوانٍ</p>
  </div>

  <!-- ===== النتائج ===== -->
  <div id="output"></div>

</div>

<script>
(function() {
  "use strict";

  const badgeMap = {
    high: "✅ موثّق",
    medium: "⚠️ قابل للتحقق",
    low: "⏸️ يتطلب مراجعة",
    none: "❌ مرفوض",
    deterministic: "⚙️ حساب حتمي"
  };

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function formatAnswer(text) {
    const escaped = escapeHtml(text);
    return escaped.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, label, url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    });
  }

  async function loadStats() {
    try {
      const r = await fetch("/api/admin/stats");
      const d = await r.json();
      document.getElementById("total").textContent = (d.total || 0).toLocaleString();
      document.getElementById("quran").textContent = ((d.breakdown && d.breakdown.quran) || 0).toLocaleString();
      document.getElementById("hadith").textContent = ((d.breakdown && d.breakdown.hadith) || 0).toLocaleString();
      const other = ((d.breakdown && d.breakdown.fiqh) || 0) + ((d.breakdown && d.breakdown.custom) || 0);
      document.getElementById("other").textContent = other.toLocaleString();
    } catch(e) {
      console.error("Stats error:", e);
    }
  }

  async function verify() {
    const q = document.getElementById("q").value.trim();
    if (!q) {
      alert("⚠️ يرجى كتابة نص للتحقق منه");
      return;
    }

    const btn = document.getElementById("verifyBtn");
    const out = document.getElementById("output");
    const loading = document.getElementById("loadingNotice");

    btn.disabled = true;
    btn.textContent = "⏳ جارٍ التحقق...";
    btn.classList.add("loading");
    out.innerHTML = "";
    loading.classList.add("active");

    try {
      const r = await fetch("/api/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: q })
      });
      const d = await r.json();

      loading.classList.remove("active");

      if (!r.ok) {
        out.innerHTML = '<div class="error">🚫 ' + escapeHtml(d.detail || "حدث خطأ غير متوقع") + '</div>';
        return;
      }

      let html = '<div class="result">';
      html += '<div class="badge ' + (d.confidence || "none") + '">' + (badgeMap[d.confidence] || d.confidence || "—") + '</div>';
      html += '<div class="answer">' + formatAnswer(d.answer) + '</div>';

      if (d.sources && d.sources.length) {
        html += '<h3 style="margin-top:24px;font-size:15px;color:#6ee7b7;font-weight:700;">📚 المصادر المسترجعة</h3>';
        for (let i = 0; i < d.sources.length; i++) {
          const s = d.sources[i];
          html += '<div class="source">';
          html += '<p>' + escapeHtml(s.text) + '</p>';
          html += '<div class="meta">';
          html += '<span>📖 ' + escapeHtml(s.book || s.source_id || "—") + '</span>';
          if (s.number) html += '<span>رقم: ' + escapeHtml(s.number) + '</span>';
          html += '<span>تشابه: ' + Math.round((s.similarity || 0) * 100) + '%</span>';
          html += '</div></div>';
        }
      }

      html += '</div>';
      out.innerHTML = html;
    } catch(e) {
      loading.classList.remove("active");
      out.innerHTML = '<div class="error">⚠️ ' + escapeHtml(e.message) + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = "🔍 تحقق الآن";
      btn.classList.remove("loading");
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("verifyBtn").addEventListener("click", verify);

    document.getElementById("q").addEventListener("keydown", function(e) {
      if (e.ctrlKey && e.key === "Enter") {
        verify();
      }
    });

    loadStats();
  });
})();
</script>
</body>
</html>
